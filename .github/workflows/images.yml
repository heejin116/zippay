name: images
# main에 앱 코드가 바뀌면 linux/amd64 이미지를 빌드해 Docker Hub에 커밋 SHA 태그로 푸시한다.
# (Apple Silicon에서 로컬 빌드하면 arm64라 Solid Cloud VM에서 안 돈다)
# 필요한 저장소 시크릿: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN(Docker Hub Access Token, 비밀번호 아님)
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/images.yml"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/zippay-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
