# 프론트 정적 파일 전용 서버. /api 분기는 이 컨테이너가 아니라 앞단(LB VM / Phase 2 Ingress)이 맡는다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # 헬스체크 (LB·K8s probe)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 파일명에 해시가 붙은 빌드 산출물은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /wallets/3 같은 클라이언트 라우트를 새로고침해도 index.html을 준다
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
