spring:
  application:
    name: zippay-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zippay}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate  # 스키마는 Flyway가 관리, JPA는 매핑 검증만
    open-in-view: false
jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: 15m
management:
  endpoints:
    web:
      exposure:
        include: health  # 헬스체크만 노출. 메트릭(prometheus)은 Phase 2 모니터링에서 추가
  endpoint:
    health:
      probes:
        enabled: true    # /actuator/health/liveness, /actuator/health/readiness (K8s probe용)
      show-details: never
