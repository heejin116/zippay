# 공통 변수. 시크릿은 여기 두지 않는다 → secrets.yml (git 제외, secrets.yml.example 참고)

# 배포할 이미지 (GitHub Actions가 푸시한 커밋 SHA 태그)
image_repo: "{{ lookup('env', 'IMAGE_REPO') }}"
image_tag: "{{ lookup('env', 'IMAGE_TAG') }}"

app_dir: /opt/zippay
backend_port: 8080
frontend_port: 8081

db_name: zippay
db_user: zippay
db_data_device: /dev/vdb     # Terraform device_id = 1
db_backup_device: /dev/vdc   # Terraform device_id = 2
db_backup_mount: /backup
db_backup_cron_minute: "*/15"   # 15분마다 → RPO 상한 15분
db_backup_keep: 96               # 최근 96개(약 하루치)만 보관

# SSH 허용 대역. 비워 두면 지금 접속한 VPN 주소의 /24를 허용한다(잠김 방지).
# VPN 대역을 확인하면 명시적으로 적는다. 예: ["10.8.0.0/24"]
ssh_allowed_cidrs: ["10.0.0.0/24"]

# 인벤토리에서 계산되는 주소
# lb_ip: lb의 static NAT 공인 IP — 접속 주소이자 lb가 앱 계층으로 나갈 때의 출발지(web ufw가 이 IP만 허용)
# db_ip: DB 앞 VR 공인 IP — 앱은 포트포워딩된 5432로 접속(backend.env DB_URL)
lb_ip: "{{ hostvars[groups['lb'][0]].ansible_host }}"
web_ips: "{{ groups['web'] | map('extract', hostvars, 'ansible_host') | list }}"
db_ip: "{{ hostvars[groups['db'][0]].ansible_host }}"
# DB에 접속하는 앱 계층 주소(pg_hba·ufw 5432). VR 포트포워딩은 목적지만 바꾸고(DNAT) 출발지는 그대로라고 보고 web IP를 쓴다.
# 첫 배포에서 연결이 막히면 DB에서 실제 출발지를 확인해 여기만 바꾼다(DESIGN.md 열린 질문).
# DB 5432 허용: VM 단계 web + K8s 단계 worker (Pod가 나갈 때 Calico가 출발지를 노드 IP로 바꾼다 → ④에서 실측 확인)
# 인벤토리 [all:vars]의 JSON 목록은 Ansible 버전에 따라 문자열 또는 리스트로 들어와서 둘 다 받는다
k8s_node_ip_list: "{{ (k8s_node_ips | from_json) if (k8s_node_ips | default([])) is string else (k8s_node_ips | default([])) }}"
db_client_ips: "{{ web_ips + k8s_node_ip_list }}"

# 관측 (6주차 구성: node_exporter → Prometheus(pull) → Grafana, 모두 lb에)
lb_private_ip: "{{ hostvars[groups['lb'][0]].private_ip }}"
db_private_ip: "{{ hostvars[groups['db'][0]].private_ip }}"
node_exporter_port: 9100
# 9100은 Prometheus(lb)에서만. web(Shared)에는 lb가 static NAT 공인 IP로 나오고, DB(같은 격리망)에는 사설 IP로 간다
prometheus_src: "{{ lb_private_ip if inventory_hostname in groups['db'] else lb_ip }}"
# Grafana(3000)·Prometheus(9090) 접속 허용 출발지 (VR 방화벽과 이중 방어)
monitoring_allowed_cidrs: "{{ ssh_allowed_cidrs }}"
grafana_dashboards_dir: /var/lib/grafana/dashboards
