# 전체 구성: ansible-playbook site.yml
# 두 번째 실행에서 changed=0 이면 멱등성 확인.
- name: 공통 — 패키지, 방화벽(ufw) 기본 정책
  hosts: all
  become: true
  vars_files: [secrets.yml]
  tasks:
    - name: 시크릿 변수 확인
      ansible.builtin.assert:
        that: [db_password | length > 0, jwt_secret | length > 0]
        quiet: true
      run_once: true

    # sudo(become)는 환경변수를 초기화해 SSH_CLIENT가 사라진다 → 일반 사용자 셸에서 읽는다
    - name: 접속한 클라이언트(VPN) 주소 확인
      ansible.builtin.shell: echo "${SSH_CLIENT%% *}"
      become: false
      register: _client
      changed_when: false

    - name: SSH 허용 대역 결정
      ansible.builtin.set_fact:
        _ssh_cidrs: >-
          {{ ssh_allowed_cidrs if ssh_allowed_cidrs | length > 0
             else [(_client.stdout.split('.')[:3] | join('.')) ~ '.0/24'] }}

    - name: SSH 허용 대역 출력 (기록용)
      ansible.builtin.debug:
        msg: "클라이언트 {{ _client.stdout }} → SSH 허용 {{ _ssh_cidrs }}"
      run_once: true

    - name: ufw 설치
      ansible.builtin.apt:
        name: ufw
        update_cache: true
        cache_valid_time: 3600

    - name: SSH 허용 (VPN 대역만)
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "22"
        src: "{{ item }}"
      loop: "{{ _ssh_cidrs }}"

    - name: 기본 정책 — 들어오는 연결 거부, ufw 활성화
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # 관측: 시스템 지표(CPU·메모리·디스크·네트워크)를 :9100/metrics로 노출 (6주차 A2)
    - name: node_exporter 설치
      ansible.builtin.apt:
        name: prometheus-node-exporter
        update_cache: true
        cache_valid_time: 3600

    - name: node_exporter 서비스
      ansible.builtin.service: {name: prometheus-node-exporter, state: started, enabled: true}

    # 인증이 없는 포트라 Prometheus(lb)에서만 연다. lb 자신은 localhost로 수집해 규칙이 필요 없다
    - name: 9100은 Prometheus(lb)에서만
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "{{ node_exporter_port }}"
        src: "{{ prometheus_src }}"
      when: inventory_hostname not in groups['lb']

- name: DB — 데이터·백업 디스크, PostgreSQL
  hosts: db
  become: true
  vars_files: [secrets.yml]
  tasks:
    - name: 디스크 장치 확인 (Terraform device_id 1·2)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ db_data_device }}", "{{ db_backup_device }}"]
      register: _disks
      failed_when: not _disks.stat.exists

    - name: 파일시스템 생성 (이미 있으면 건너뜀)
      community.general.filesystem:
        dev: "{{ item }}"
        fstype: ext4
      loop: ["{{ db_data_device }}", "{{ db_backup_device }}"]

    # 패키지 설치 전에 마운트해야 클러스터가 데이터 디스크에 만들어진다
    - name: 데이터 디스크를 /var/lib/postgresql에 마운트
      ansible.posix.mount:
        path: /var/lib/postgresql
        src: "{{ db_data_device }}"
        fstype: ext4
        opts: defaults,nofail
        state: mounted

    - name: 백업 디스크 마운트
      ansible.posix.mount:
        path: "{{ db_backup_mount }}"
        src: "{{ db_backup_device }}"
        fstype: ext4
        opts: defaults,nofail
        state: mounted

    - name: PostgreSQL 16 설치
      ansible.builtin.apt:
        name: [postgresql-16, python3-psycopg2, acl]
        update_cache: true
        cache_valid_time: 3600

    # 데이터 디스크를 재연결하면(VM 재생성) 데이터는 남아 있지만 /etc/postgresql 설정은 새 루트 디스크라 없다.
    # 패키지 설치는 기존 데이터 디렉터리가 있으면 클러스터 생성을 건너뛰므로(11/18 확인),
    # 새 설정을 만든 뒤 기존 데이터를 다시 연결한다 — "디스크만 남기고 VM을 다시 만든다"는 설계의 실제 경로.
    - name: 클러스터 설정 확인
      ansible.builtin.stat:
        path: /etc/postgresql/16/main/postgresql.conf
      register: _pgconf

    - name: 클러스터 설정 생성 (기존 데이터가 있으면 그대로 다시 연결)
      when: not _pgconf.stat.exists
      ansible.builtin.shell: |
        set -euo pipefail
        D=/var/lib/postgresql/16/main
        if [ -f "$D/PG_VERSION" ]; then
          mv "$D" "$D.reattach"
          pg_createcluster 16 main
          rm -rf "$D"
          mv "$D.reattach" "$D"
          chown -R postgres:postgres "$D"
          echo reattached
        else
          pg_createcluster 16 main
          echo created
        fi
      args:
        executable: /bin/bash
      register: _pgcluster

    - name: 클러스터 생성·재연결 결과 (기록용)
      when: not _pgconf.stat.exists
      ansible.builtin.debug:
        msg: "{{ _pgcluster.stdout_lines | last }}"

    - name: PostgreSQL 기동
      ansible.builtin.service:
        name: postgresql@16-main
        state: started
        enabled: true

    - name: 외부 접속 수신
      ansible.builtin.lineinfile:
        path: /etc/postgresql/16/main/postgresql.conf
        regexp: "^#?listen_addresses"
        line: "listen_addresses = '*'"
      notify: restart postgresql

    - name: pg_hba — 앱 계층에서만 zippay DB 접속 허용
      ansible.builtin.blockinfile:
        path: /etc/postgresql/16/main/pg_hba.conf
        marker: "# {mark} zippay web 계층 (Ansible 관리)"
        block: |
          {% for ip in db_client_ips %}
          host  {{ db_name }}  {{ db_user }}  {{ ip }}/32  scram-sha-256
          {% endfor %}
      notify: reload postgresql

    - name: 앱 계정
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
      become_user: postgres
      no_log: true

    - name: 앱 DB (소유자 = 앱 계정, 스키마는 앱의 Flyway가 만든다)
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
      become_user: postgres

    # 백업: 원본(데이터 디스크)과 다른 디스크에 주기적으로 논리 백업. RPO 상한 = 백업 주기
    - name: 백업 디렉터리 (postgres 소유)
      ansible.builtin.file:
        path: "{{ db_backup_mount }}/pg"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: 백업 스크립트
      ansible.builtin.template:
        src: templates/zippay-backup.sh.j2
        dest: /usr/local/bin/zippay-backup.sh
        mode: "0755"

    - name: 주기 백업 (cron, postgres 계정)
      ansible.builtin.cron:
        name: zippay pg_dump
        user: postgres
        minute: "{{ db_backup_cron_minute }}"
        job: /usr/local/bin/zippay-backup.sh

    - name: 5432는 앱 계층에서만 (VR 방화벽과 이중 방어)
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "5432"
        src: "{{ item }}"
      loop: "{{ db_client_ips }}"

  handlers:
    - name: restart postgresql
      ansible.builtin.service: {name: postgresql, state: restarted}
    - name: reload postgresql
      ansible.builtin.service: {name: postgresql, state: reloaded}

- name: web — Docker, zippay 앱 계층
  hosts: web
  become: true
  vars_files: [secrets.yml]
  tasks:
    - name: 이미지 태그 확인
      ansible.builtin.assert:
        that: [image_repo | length > 0, image_tag | length > 0]
        fail_msg: "IMAGE_REPO, IMAGE_TAG 환경변수를 지정하세요 (예: IMAGE_TAG=$(git rev-parse HEAD))"
        quiet: true

    - name: Docker 설치
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        update_cache: true
        cache_valid_time: 3600

    - name: Docker 서비스
      ansible.builtin.service: {name: docker, state: started, enabled: true}

    - name: 앱 디렉터리
      ansible.builtin.file: {path: "{{ app_dir }}", state: directory, mode: "0750"}

    - name: compose 파일
      ansible.builtin.copy:
        src: ../compose/docker-compose.web.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0640"

    - name: 이미지 태그 (.env — compose가 읽는다)
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        content: |
          IMAGE_REPO={{ image_repo }}
          IMAGE_TAG={{ image_tag }}
        mode: "0640"

    - name: 백엔드 시크릿 (0600, 저장소 밖)
      ansible.builtin.template:
        src: templates/backend.env.j2
        dest: "{{ app_dir }}/backend.env"
        mode: "0600"
      no_log: true

    - name: 앱 기동
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        pull: missing
        state: present

    - name: 백엔드 헬스체크
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ backend_port }}/actuator/health"
      register: _health
      until: _health.status == 200
      retries: 30
      delay: 5
      changed_when: false

    # lb는 격리망에서 static NAT 공인 IP(lb_ip)로 나온다
    - name: 앱 포트는 LB에서만
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "{{ item }}"
        src: "{{ lb_ip }}"
      loop: ["{{ backend_port }}", "{{ frontend_port }}"]

- name: LB — nginx, TLS 종료, 경로 분기
  hosts: lb
  become: true
  tasks:
    - name: nginx 설치
      ansible.builtin.apt:
        name: nginx
        update_cache: true
        cache_valid_time: 3600

    - name: 인증서 디렉터리
      ansible.builtin.file: {path: /etc/nginx/tls, state: directory, mode: "0700"}

    - name: 자체 서명 인증서 (한 번만 생성)
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -nodes -newkey rsa:2048 -days 365
          -keyout /etc/nginx/tls/zippay.key -out /etc/nginx/tls/zippay.crt
          -subj "/CN=zippay" -addext "subjectAltName=IP:{{ ansible_host }}"
        creates: /etc/nginx/tls/zippay.crt
      notify: reload nginx

    - name: 사이트 설정
      ansible.builtin.template:
        src: templates/lb.conf.j2
        dest: /etc/nginx/sites-available/zippay
        mode: "0644"
      notify: reload nginx

    - name: 사이트 활성화
      ansible.builtin.file:
        src: /etc/nginx/sites-available/zippay
        dest: /etc/nginx/sites-enabled/zippay
        state: link
      notify: reload nginx

    - name: 기본 사이트 비활성화
      ansible.builtin.file: {path: /etc/nginx/sites-enabled/default, state: absent}
      notify: reload nginx

    - name: 80·443 공개
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "{{ item }}"
      loop: ["80", "443"]

  handlers:
    - name: reload nginx
      ansible.builtin.shell: nginx -t && systemctl reload nginx

- name: 관측 — Prometheus·Grafana·알림 룰 (lb, 6주차 구성)
  hosts: lb
  become: true
  vars_files: [secrets.yml]
  tasks:
    - name: Grafana 비밀번호 확인
      ansible.builtin.assert:
        that: [grafana_admin_password is defined, grafana_admin_password | length >= 12]
        fail_msg: "secrets.yml에 grafana_admin_password(12자 이상)를 넣으세요 (secrets.yml.example 참고)"
        quiet: true

    - name: Prometheus 설치
      ansible.builtin.apt:
        name: prometheus
        update_cache: true
        cache_valid_time: 3600

    - name: 알림 룰 디렉터리
      ansible.builtin.file: {path: /etc/prometheus/rules, state: directory, mode: "0755"}

    - name: 알림 룰 (up == 0, 1분)
      ansible.builtin.copy:
        src: files/zippay-alerts.yml
        dest: /etc/prometheus/rules/zippay-alerts.yml
        mode: "0644"
        validate: promtool check rules %s
      notify: restart prometheus

    - name: 수집 대상 (scrape_configs)
      ansible.builtin.template:
        src: templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
        validate: promtool check config %s
      notify: restart prometheus

    # remote-write 수신: k6 결과를 Prometheus로 받아 서버 지표와 같은 시간축에 둔다 / 보관 30일
    - name: Prometheus 실행 옵션
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus
        regexp: "^ARGS="
        line: 'ARGS="--web.enable-remote-write-receiver --storage.tsdb.retention.time=30d"'
      notify: restart prometheus

    - name: Prometheus 서비스
      ansible.builtin.service: {name: prometheus, state: started, enabled: true}

    # Grafana: 공식 저장소에서 설치 (6주차 A5와 같은 방법)
    - name: Grafana 저장소 키
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Grafana 저장소
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        filename: grafana

    - name: Grafana 설치
      ansible.builtin.apt:
        name: grafana
        update_cache: true

    - name: Grafana 설정 (admin 비밀번호·가입 차단·외부 통신 끄기)
      community.general.ini_file:
        path: /etc/grafana/grafana.ini
        section: "{{ item.s }}"
        option: "{{ item.o }}"
        value: "{{ item.v }}"
        mode: "0640"
      loop:
        - {s: security, o: admin_password, v: "{{ grafana_admin_password }}"}
        - {s: users, o: allow_sign_up, v: "false"}
        - {s: analytics, o: reporting_enabled, v: "false"}
        - {s: analytics, o: check_for_updates, v: "false"}
      loop_control: {label: "{{ item.s }}.{{ item.o }}"}
      no_log: true
      notify: restart grafana

    - name: Grafana 데이터소스 (Prometheus, uid 고정)
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/zippay.yml
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              url: http://localhost:9090
              isDefault: true
      notify: restart grafana

    - name: Grafana 대시보드 폴더 등록
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/dashboards/zippay.yml
        mode: "0644"
        content: |
          apiVersion: 1
          providers:
            - name: zippay
              folder: zippay
              type: file
              options:
                path: {{ grafana_dashboards_dir }}
      notify: restart grafana

    - name: 대시보드 디렉터리
      ansible.builtin.file: {path: "{{ grafana_dashboards_dir }}", state: directory, owner: grafana, group: grafana, mode: "0755"}

    # 6주차에서 Import한 node_exporter 대시보드(Node Exporter Full, ID 1860)를 파일로 받아 재구축 때도 자동으로 올라오게 한다
    - name: Node Exporter Full 대시보드 받기
      ansible.builtin.get_url:
        url: https://grafana.com/api/dashboards/1860/revisions/latest/download
        dest: "{{ grafana_dashboards_dir }}/node-exporter-full.json"
        owner: grafana
        group: grafana
        mode: "0644"
      notify: restart grafana

    - name: 대시보드의 데이터소스 자리표시자를 고정 uid로
      ansible.builtin.replace:
        path: "{{ grafana_dashboards_dir }}/node-exporter-full.json"
        regexp: '\$\{DS_PROMETHEUS\}'
        replace: prometheus
      notify: restart grafana

    - name: Grafana 서비스
      ansible.builtin.service: {name: grafana-server, state: started, enabled: true}

    - name: Grafana(3000)·Prometheus(9090)는 관리 출발지만 (VR 방화벽과 이중 방어)
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "{{ item[0] }}"
        src: "{{ item[1] }}"
      loop: "{{ ['3000', '9090'] | product(monitoring_allowed_cidrs) | list }}"

  handlers:
    - name: restart prometheus
      ansible.builtin.service: {name: prometheus, state: restarted}
    - name: restart grafana
      ansible.builtin.service: {name: grafana-server, state: restarted}

