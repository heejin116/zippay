apiVersion: apps/v1
kind: Deployment
metadata:
  name: zippay-frontend
  labels:
    app.kubernetes.io/name: zippay-frontend
    {{- include "zippay.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: zippay-frontend
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zippay-frontend
        {{- include "zippay.labels" . | nindent 8 }}
    spec:
      {{- if .Values.priorityClass.create }}
      priorityClassName: {{ .Values.priorityClass.name }}
      {{- end }}
      {{- include "zippay.spread" "zippay-frontend" | nindent 6 }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx-unprivileged 이미지의 nginx 사용자
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: {{ include "zippay.image" (dict "root" . "app" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NGINX_PORT
              value: {{ .Values.frontend.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- include "zippay.containerSecurity" . | nindent 10 }}
          volumeMounts:
            # 루트 파일시스템은 읽기 전용: nginx가 쓰는 곳만 따로 연다
            - name: tmp
              mountPath: /tmp                # pid, 임시 파일
            - name: conf
              mountPath: /etc/nginx/conf.d   # 시작 시 envsubst가 default.conf를 만든다
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zippay-frontend
  labels: {{- include "zippay.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zippay-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zippay-frontend
  labels: {{- include "zippay.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zippay-frontend
